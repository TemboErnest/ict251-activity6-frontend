<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ICT251 Activity 6 - Front End</title>
  <style>
    :root {
      --page-bg: #dfe0ee;
      --panel-bg: #f1f1f1;
      --field-bg: #f1f1f1;
      --border: #d4d4d4;
      --border-strong: #7b7b7b;
      --accent: #5a4dd8;
      --accent-dark: #4336c6;
      --text: #1d1d1f;
      --muted: #5f6368;
      --link: #1a73e8;
      --required: #d93025;
      --shadow: rgba(68, 67, 104, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--page-bg);
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 30px 20px;
    }

    .page {
      width: min(100%, 980px);
      background: var(--panel-bg);
      border: 2px solid #bdb7d8;
      border-radius: 6px;
      box-shadow: 0 0 0 1px rgba(97, 86, 140, 0.08);
      overflow: hidden;
    }

    .form-shell { padding: 0; }

    .header {
      border-bottom: 1px solid rgba(37, 37, 45, 0.18);
      padding: 26px 30px 18px;
      background: rgba(255,255,255,0.12);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 2.8vw, 4rem);
      line-height: 1.2;
      font-weight: 400;
      letter-spacing: -0.04em;
      color: #2a2a2d;
    }

    .account-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 30px 10px;
      border-bottom: 1px solid rgba(37, 37, 45, 0.18);
      background: rgba(255,255,255,0.06);
    }

    .account {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(0.95rem, 1.6vw, 1.15rem);
      color: var(--text);
      flex-wrap: wrap;
    }

    .account .email, .switch {
      color: var(--link);
      text-decoration: none;
      font-weight: 500;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(90, 94, 105, 0.42);
      border-radius: 50%;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #5f6368;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .icon-button:hover { background: rgba(0,0,0,0.03); }

    .not-shared {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.98rem;
      color: #4b4d4f;
      padding: 12px 30px 8px;
    }

    .not-shared svg { opacity: 0.7; }

    .required-note {
      padding: 18px 30px 8px;
      color: var(--required);
      font-size: 0.98rem;
      font-weight: 500;
    }

    .required-note .ast { margin-right: 4px; }

    form { margin: 0; }

    .fields {
      padding: 0 30px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field-block {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(102, 101, 112, 0.26);
      border-radius: 6px;
      padding: 18px 18px 10px;
      min-height: 124px;
    }

    .field-block label {
      display: block;
      font-size: clamp(1.05rem, 1.9vw, 1.6rem);
      font-weight: 400;
      margin-bottom: 20px;
      letter-spacing: -0.03em;
    }

    .required {
      color: var(--required);
      margin-left: 4px;
      font-weight: 600;
    }

    input {
      width: 100%;
      border: none;
      border-bottom: 2px solid var(--border-strong);
      background: transparent;
      color: var(--text);
      font-size: clamp(1.05rem, 1.7vw, 1.2rem);
      padding: 6px 0 8px;
      outline: none;
    }

    input::placeholder { color: #7a7c7e; }
    input:focus { border-bottom-color: var(--accent); }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 30px 22px;
      border-top: 1px solid rgba(37, 37, 45, 0.18);
    }

    .submit-btn {
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 700;
      font-size: 1.02rem;
      padding: 16px 24px;
      min-width: 120px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(54, 46, 134, 0.3);
    }

    .submit-btn:hover { background: var(--accent-dark); }

    .clear-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      color: #2b2b2d;
      font-size: 1.1rem;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: 4px;
    }

    .clear-btn:hover { background: rgba(0,0,0,0.03); }

    @media (max-width: 640px) {
      .page { width: 100%; }
      .header, .account-row, .not-shared, .required-note, .fields, .actions {
        padding-left: 18px;
        padding-right: 18px;
      }
      .actions { flex-direction: column; align-items: stretch; }
      .clear-btn { align-self: flex-end; }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="ICT251 front-end assignment form">
    <div class="form-shell">
      <header class="header">
        <h1>ICT251 Activity 6 -Front End</h1>
      </header>

      <div class="account-row">
        <div class="account">
          <a href="#" class="email">ernesttembo03@gmail.com</a>
          <a href="#" class="switch">Switch accounts</a>
        </div>
        <button class="icon-button" aria-label="Theme toggle" type="button">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 15.5A7.5 7.5 0 0 1 8.5 4a7.5 7.5 0 1 0 11.5 11.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="not-shared">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 9a3 3 0 1 1 6 0 3 3 0 0 1-6 0Zm-4.7 9.2a7.5 7.5 0 0 1 15.4 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>Not shared</span>
      </div>

      <div class="required-note"><span class="ast">*</span>Indicates required question</div>

      <form>
        <div class="fields">
          <div class="field-block">
            <label for="student-number">Student Number <span class="required">*</span></label>
            <input id="student-number" type="text" name="studentNumber" placeholder="Your answer" aria-label="Student Number" required />
          </div>

          <div class="field-block">
            <label for="student-name">Student Name <span class="required">*</span></label>
            <input id="student-name" type="text" name="studentName" placeholder="Your answer" aria-label="Student Name" required />
          </div>

          <div class="field-block">
            <label for="front-end-url">Front End URL <span class="required">*</span></label>
            <input id="front-end-url" type="url" name="frontEndUrl" placeholder="Your answer" aria-label="Front End URL" required />
          </div>
        </div>

        <div class="actions">
          <button class="submit-btn" type="submit">Submit</button>
          <button class="clear-btn" type="reset">Clear form</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
